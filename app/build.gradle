plugins { id 'com.android.application' }

android {
    namespace 'io.github.storageisolation.visibilityfix'
    compileSdk 35
    buildFeatures { buildConfig true }
    lint {
        // Sideloaded LSPosed module; preserve tested target behavior, not a Play Store submission.
        disable 'ExpiredTargetSdkVersion'
    }
    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            debuggable false
            // Retain the existing development signing setup until a release key is configured.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    defaultConfig {
        applicationId 'io.github.storageisolation.visibilityfix'
        minSdk 30
        targetSdk 28
        versionCode 21
        versionName '0.21'
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'com.google.android.material:material:1.12.0'
}
