name: Publish APK release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.18
      run_id:
        description: Successful Build LSPosed module run containing the APK
        required: true
        default: '37232496128'
      target:
        description: Source commit or branch for the release tag
        required: true
        default: main

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || 'v0.18' }}
      RELEASE_TARGET: ${{ inputs.target || github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: storage-isolation-visibility-fix-debug
          run-id: ${{ inputs.run_id || '37232496128' }}
          github-token: ${{ github.token }}
          path: dist
      - name: Publish existing APK
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/app-debug.apk
          asset="FixRedirectStorage-${RELEASE_TAG#v}-API102.apk"
          mv dist/app-debug.apk "dist/$asset"
          cat > release-notes.md <<'NOTES'
          Adds fallback UID lookup and retries failed lookups while preserving the existing three hooks. Fixes stale AppID caching after reinstall and reflection access to the internal package manager service.
          NOTES
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_TARGET" \
              --title "FixRedirectStorage $RELEASE_TAG (API 102)" \
              --notes-file release-notes.md
          else
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          fi
          if ! gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
            gh release upload "$RELEASE_TAG" "dist/$asset"
          fi
