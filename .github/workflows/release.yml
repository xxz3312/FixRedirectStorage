name: Publish APK release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.23
      run_id:
        description: Successful Build LSPosed module run containing a signed Release APK
        required: true
        default: '38449688643'
      target:
        description: Source commit or branch for the release tag
        required: true
        default: main

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || 'v0.23' }}
      RELEASE_TARGET: ${{ inputs.target || github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: storage-isolation-visibility-fix-release
          run-id: ${{ inputs.run_id || '38449688643' }}
          github-token: ${{ github.token }}
          path: dist
      - name: Publish existing APK
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/app-release.apk
          asset="FixRedirectStorage-${RELEASE_TAG#v}-API102.apk"
          mv dist/app-release.apk "dist/$asset"
          cat > release-notes.md <<'NOTES'
          Switches to R8-shrunk Release builds, adds adaptive icons and a red upgrade notice for unsupported Storage Isolation versions. Improves diagnostics and fallback enumeration while retaining the verified 8.8.1 hooks.
          NOTES
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_TARGET" \
              --title "FixRedirectStorage $RELEASE_TAG (API 102)" \
              --notes-file release-notes.md
          else
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          fi
          if ! gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
            gh release upload "$RELEASE_TAG" "dist/$asset"
          fi
