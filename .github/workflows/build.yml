name: Build LSPosed module

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleRelease :app:assembleDebug --stacktrace
      - name: Verify release APK
        run: |
          apksigner verify app/build/outputs/apk/release/app-release.apk
          if aapt dump badging app/build/outputs/apk/release/app-release.apk | grep -q '^application-debuggable'; then
            echo 'Release APK must not be debuggable'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: storage-isolation-visibility-fix-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: storage-isolation-visibility-fix-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
